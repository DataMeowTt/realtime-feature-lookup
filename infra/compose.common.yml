name: rtfl

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: bank
      APP_USER_PASSWORD: bank
      NUM_USERS: ${NUM_USERS:-100000}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  jobmanager:
    build: ./flink
    image: rtfl/flink:1.20.5
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: &flink-props |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 4
        taskmanager.memory.process.size: 2048m
        jobmanager.memory.process.size: 1024m
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: AT_LEAST_ONCE
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  taskmanager:
    image: rtfl/flink:1.20.5
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: *flink-props

  # Metric Flink (jobmanager + taskmanager :9249) -> Prometheus -> Grafana, dùng chung cho cả 2 stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-enterprise:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Chạy generator / consumer / probe / tests trong cùng mạng Docker (cùng đồng hồ host).
  # Chỉ dùng qua `docker compose run`, không tự bật khi `up`.
  tools:
    image: eclipse-temurin:17-jre
    profiles: ["tools"]
    working_dir: /work
    environment:
      # Arrow trong Fluss client cần truy cập java.nio
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
    volumes:
      - ..:/work

volumes:
  oracle-data:
