# 3 tablet-server: bucket của mỗi bảng được chia ra nhiều máy (replication factor mặc định = 1),
# nên user nóng (hot key) chỉ dồn tải lên 1 trong 3 máy — ngang với Redis Cluster 3 node của Stack A.
x-tablet: &tablet
  image: apache/fluss:1.0.0
  command: tabletServer
  mem_limit: 512m
  depends_on:
    - coordinator-server
  volumes:
    - fluss-remote:/tmp/fluss/remote-data

services:
  zookeeper:
    image: zookeeper:3.9.2
    mem_limit: 256m
    environment:
      ZK_SERVER_HEAP: 128

  coordinator-server:
    image: apache/fluss:1.0.0
    command: coordinatorServer
    mem_limit: 400m
    depends_on:
      - zookeeper
    environment:
      FLUSS_ENV_JAVA_OPTS: "-Xmx192m"
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://coordinator-server:9123
        remote.data.dir: /tmp/fluss/remote-data
    volumes:
      - fluss-remote:/tmp/fluss/remote-data

  tablet-server:
    <<: *tablet
    environment:
      FLUSS_ENV_JAVA_OPTS: "-Xmx256m"
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://tablet-server:9123
        tablet-server.id: 0
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        kv.snapshot.interval: 0s
        kv.rocksdb.block.cache-size: 64mb
        kv.rocksdb.writebuffer.size: 16mb

  tablet-server-1:
    <<: *tablet
    environment:
      FLUSS_ENV_JAVA_OPTS: "-Xmx256m"
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://tablet-server-1:9123
        tablet-server.id: 1
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        kv.snapshot.interval: 0s
        kv.rocksdb.block.cache-size: 64mb
        kv.rocksdb.writebuffer.size: 16mb

  tablet-server-2:
    <<: *tablet
    environment:
      FLUSS_ENV_JAVA_OPTS: "-Xmx256m"
      FLUSS_PROPERTIES: |
        zookeeper.address: zookeeper:2181
        bind.listeners: FLUSS://tablet-server-2:9123
        tablet-server.id: 2
        data.dir: /tmp/fluss/data
        remote.data.dir: /tmp/fluss/remote-data
        kv.snapshot.interval: 0s
        kv.rocksdb.block.cache-size: 64mb
        kv.rocksdb.writebuffer.size: 16mb

# Thư mục remote dùng chung cho coordinator và các tablet-server
volumes:
  fluss-remote:
